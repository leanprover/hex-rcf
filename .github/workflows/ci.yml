name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: Install oracle dependencies
        run: python3 -m pip install --user python-flint
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build library and release regressions
        run: lake build HexRCF HexRCFTests
      - name: Build conformance sidecar
        run: |
          cd conformance
          lake exe cache get
          lake build
      - name: Conformance oracle
        run: |
          (cd conformance && lake exe hexrcf_emit_fixtures) > /tmp/hex-rcf-fresh.jsonl
          diff -u conformance-fixtures/HexRCF/rcf.jsonl /tmp/hex-rcf-fresh.jsonl
          python3 scripts/oracle/rcf_flint.py < /tmp/hex-rcf-fresh.jsonl
      - name: Build and verify benchmarks
        env:
          BENCH_VERIFY_HARD_CAP_SECONDS: "360"
        run: |
          cd bench
          lake exe cache get
          lake build hexrcf_bench HexRCFProofProbe
          bash ../scripts/ci/check_bench_verify_budget.sh hexrcf_bench
