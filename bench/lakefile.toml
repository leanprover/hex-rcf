name = "hexrcf-bench"
defaultTargets = ["hexrcf_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRCF"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "36e7d67fc3a511ca9d69f360def6e50769e439d4"

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_lib]]
name = "HexRCFProofProbe"
globs = [
  "HexRCF.BenchHash",
  "HexRCF.ProofProbe.Support",
  "HexRCF.ProofProbe.Generated",
  "HexRCF.ProofProbe.Validate",
  "HexRCF.ProofProbe.Baseline",
  "HexRCF.ProofProbe.Quadratic.Reify",
  "HexRCF.ProofProbe.Quadratic.Input",
  "HexRCF.ProofProbe.Quadratic.Search",
  "HexRCF.ProofProbe.Quadratic.Literal",
  "HexRCF.ProofProbe.Quadratic.Replay",
  "HexRCF.ProofProbe.Quadratic.Tactic",
]

[[lean_lib]]
name = "HexRCFProofProbeScientific"
globs = [
  "HexRCF.ProofProbe.Degree10.Reify",
  "HexRCF.ProofProbe.Degree10.Input",
  "HexRCF.ProofProbe.Degree10.Search",
  "HexRCF.ProofProbe.Degree10.Literal",
  "HexRCF.ProofProbe.Degree10.Replay",
  "HexRCF.ProofProbe.Degree10.Tactic",
  "HexRCF.ProofProbe.Degree50.Reify",
  "HexRCF.ProofProbe.Degree50.Input",
  "HexRCF.ProofProbe.Degree50.Search",
  "HexRCF.ProofProbe.Degree50.Literal",
  "HexRCF.ProofProbe.Degree50.Replay",
  "HexRCF.ProofProbe.Degree50.Tactic",
  "HexRCF.ProofProbe.DoubleDegree50",
]

[[lean_exe]]
name = "hexrcf_bench"
root = "HexRCF.Bench"
