name = "hex-rcf"
defaultTargets = ["HexRCF"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRealRoots"
git = "https://github.com/leanprover/hex-real-roots.git"
rev = "7944e49a88b81ed5df56a520eefdf1245ba0fd2d"

[[require]]
name = "HexRealRootsMathlib"
git = "https://github.com/leanprover/hex-real-roots-mathlib.git"
rev = "2b0713868b8bf00726283f7414cf29d178b11339"

[[require]]
name = "HexPolyZ"
git = "https://github.com/leanprover/hex-poly-z.git"
rev = "0166cc099045e0366efd6a152f633c9e9baf0550"

[[require]]
name = "HexPolyZMathlib"
git = "https://github.com/leanprover/hex-poly-z-mathlib.git"
rev = "b382cc56b2864ae439726b8ad56bb3ce8e9c10b5"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "d54dddc581e08be364c278052863524bff7a99a9"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "HexRCF"

[[lean_lib]]
name = "HexRCFTests"
globs = [
  "HexRCF.LanguageTests",
  "HexRCF.SturmBuilderTests",
  "HexRCF.CarrierTests",
  "HexRCF.IsolationsTests",
  "HexRCF.SeparationTests",
  "HexRCF.CellsTests",
  "HexRCF.CommonRootTests",
  "HexRCF.SignMatrixTests",
  "HexRCF.BuilderTests",
  "HexRCF.CertificateTests",
  "HexRCF.DecisionTests",
  "HexRCF.ReifyTests",
  "HexRCF.LintTests",
]
