name = "hex-rcf"
defaultTargets = ["HexRCF"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRealRoots"
git = "https://github.com/leanprover/hex-real-roots.git"
rev = "v0.4.0"

[[require]]
name = "HexRealRootsMathlib"
git = "https://github.com/leanprover/hex-real-roots-mathlib.git"
rev = "v0.4.0"

[[require]]
name = "HexPolyZ"
git = "https://github.com/leanprover/hex-poly-z.git"
rev = "v0.4.0"

[[require]]
name = "HexPolyZMathlib"
git = "https://github.com/leanprover/hex-poly-z-mathlib.git"
rev = "v0.4.0"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.4.0"

[[lean_lib]]
name = "HexRCF"

[[lean_lib]]
name = "HexRCFTests"
globs = ["HexRCF.LanguageTests", "HexRCF.SturmBuilderTests", "HexRCF.CarrierTests", "HexRCF.IsolationsTests", "HexRCF.SeparationTests", "HexRCF.CellsTests", "HexRCF.CommonRootTests", "HexRCF.SignMatrixTests", "HexRCF.BuilderTests", "HexRCF.CertificateTests", "HexRCF.DecisionTests", "HexRCF.ReifyTests", "HexRCF.LintTests"]
