name = "hexrcf-conformance"
defaultTargets = ["HexRCFConformance", "hexrcf_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRCF"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "36e7d67fc3a511ca9d69f360def6e50769e439d4"

[[lean_lib]]
name = "HexRCFConformance"
globs = ["HexRCF.Conformance"]

[[lean_exe]]
name = "hexrcf_emit_fixtures"
root = "HexRCF.EmitFixtures"
